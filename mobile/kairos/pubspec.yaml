name: kairos
description: >-
  Kairos — predykcyjny kopilot uwagi. Fuzja sensorów + lokalny model językowy,
  100% przetwarzania na urządzeniu. Zero bajtów opuszcza telefon.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Stan / DI / nawigacja ────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # ── Programowanie funkcyjne (Either na granicach warstw) ─────────────────
  fpdart: ^1.1.0

  # ── Trwałość danych (wyłącznie lokalna) ──────────────────────────────────
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # ── Sensory i stan urządzenia ────────────────────────────────────────────
  sensors_plus: ^6.1.1
  battery_plus: ^6.2.1
  pedometer: ^4.0.2

  # ── Tło, uprawnienia, powiadomienia ──────────────────────────────────────
  flutter_foreground_task: ^8.10.4
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.4

  # ── Lokalny model językowy (opcjonalny — patrz gemma_llm_engine.dart) ────
  flutter_gemma: ^0.9.0

  # ── UI ───────────────────────────────────────────────────────────────────
  flutter_animate: ^4.5.0

  # ── Narzędzia ────────────────────────────────────────────────────────────
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/prompts/
    - assets/models/manifest.json

  # Czcionki są dołączone lokalnie (a nie pobierane w runtime przez
  # google_fonts) — aplikacja nie wykonuje ŻADNEGO ruchu sieciowego.
  # Używamy fontów zmiennych (jeden plik na rodzinę), a konkretne grubości
  # ustawiamy przez `fontVariations` w AppTypography.
  # Pliki pobiera skrypt: tool/fetch_fonts.sh
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
