<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ski Jump — Symulator Skoków Narciarskich</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b1420;
    font-family:"Segoe UI",system-ui,sans-serif;touch-action:none;
    -webkit-user-select:none;user-select:none}
  #game{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:10px;left:12px;color:#eaf4ff;font-size:15px;
    text-shadow:0 1px 3px #000;line-height:1.5;pointer-events:none}
  #wind{position:fixed;top:10px;right:12px;color:#eaf4ff;text-align:right;
    font-size:15px;text-shadow:0 1px 3px #000;pointer-events:none}
  #msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);color:#fff;
    font-size:clamp(16px,3.4vw,26px);font-weight:600;text-align:center;
    text-shadow:0 2px 6px #000;pointer-events:none;white-space:pre-line}
  #panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(10,22,38,.94);border:1px solid #3b5878;border-radius:14px;
    color:#eaf4ff;padding:22px 30px;min-width:290px;display:none;text-align:center}
  #panel h2{margin:0 0 8px;font-size:26px;color:#8fd0ff}
  #panel table{margin:10px auto;border-collapse:collapse;font-size:14px}
  #panel td{padding:2px 10px;text-align:right}
  #panel td:first-child{text-align:left;color:#9db8d4}
  #panel .total{font-size:22px;font-weight:700;color:#ffd76e;margin-top:6px}
  #panel button{margin-top:14px;background:#2f7fd4;border:0;color:#fff;
    font-size:16px;padding:10px 26px;border-radius:8px;cursor:pointer}
  .judges{font-size:15px;letter-spacing:2px;color:#bfe0ff}
  .strike{text-decoration:line-through;opacity:.45}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="wind"></div>
<div id="msg"></div>
<div id="panel"></div>

<script>
"use strict";
/* ============================================================================
   SKI JUMP — hiperrealistyczny (na miarę przeglądarki) symulator skoków.
   Fizyka: F_L = 0.5·ρ·v²·S·C_L(AoA), F_D = 0.5·ρ·v²·S·C_D(AoA),
   dynamiczny wiatr (szum wielooktawowy), punktacja FIS (K-125 / HS-140).
   Sterowanie:
     NAJAZD:   ← / → (lub przechylanie palcem) — utrzymuj balans na środku
     WYBICIE:  SPACJA / tap — traf w moment na progu!
     LOT:      ↑ / ↓ (lub przesuwanie palcem góra-dół) — kąt natarcia
     LĄDOWANIE: SPACJA / tap w krótkim oknie = TELEMARK (bonus stylowy)
   ========================================================================== */

// ------------------------------------------------------------- profil skoczni
const K_POINT = 125, HILL_SIZE = 140, METER_VALUE = 1.8;
const WIND_FACTOR = 10.8, TAKEOFF_ANGLE = -10.5 * Math.PI/180;

// Zeskok (x>=0, x w metrach od progu): uskok pod stołem (knoll 3 m), parabola
// do nachylenia maks. ~36°, odcinek prosty, na końcu wypłaszczenie (outrun).
// Stałe dostrojone symulacją: optymalny lot ~140 m (HS), neutralny ~122 m (K).
const KNOLL = 3.0;                                        // uskok pod progiem [m]
const SLOPE_MAX = 0.72;                                   // tan ~36°
const X_CAP  = (SLOPE_MAX - 0.18) / (2*0.0030);           // ~90 m: pełne nachylenie
const X_FLAT = 150;                                       // początek wypłaszczenia
const Y_CAP  = -(0.18*X_CAP + 0.0030*X_CAP*X_CAP);
const Y_FLAT = Y_CAP - SLOPE_MAX*(X_FLAT - X_CAP);
function hillY(x){
  if (x < 0)      return Math.tan(TAKEOFF_ANGLE)*x;       // stół
  if (x <= X_CAP) return -(KNOLL + 0.18*x + 0.0030*x*x);
  if (x <= X_FLAT) return -KNOLL + Y_CAP - SLOPE_MAX*(x - X_CAP);
  // wypłaszczenie: nachylenie maleje liniowo z SLOPE_MAX do 0.05 na 40 m
  const d = x - X_FLAT;
  if (d <= 40) return -KNOLL + Y_FLAT - (SLOPE_MAX*d - (SLOPE_MAX-0.05)*d*d/80);
  const y40 = Y_FLAT - (SLOPE_MAX*40 - (SLOPE_MAX-0.05)*20);
  return -KNOLL + y40 - 0.05*(d - 40);
}
function hillSlope(x){ const e=0.01; return (hillY(x+e)-hillY(x-e))/(2*e); }
// Odległość FIS ~ długość łuku zeskoku od progu (prekomputowana tablica).
const arcLen = new Float32Array(2200);
(()=>{ let s=0, px=0, py=hillY(0);
  for(let i=1;i<2200;i++){ const x=i*0.1, y=hillY(x);
    s+=Math.hypot(x-px,y-py); arcLen[i]=s; px=x; py=y; } })();
function distanceAt(x){ const i=Math.max(0,Math.min(2199,Math.round(x*10)));
  return arcLen[i]; }

// ------------------------------------------------------------------- wiatr
const Wind = {
  base: 0, gust: 2.4, t: 0, seed: Math.random()*1000,
  sum: 0, n: 0, rec: false,
  reset(){ this.base = (Math.random()*2-1)*1.8; this.seed = Math.random()*1000; },
  // szum wielooktawowy (suma sinusów ~ Perlin 1D)
  sample(){
    const t = this.t + this.seed;
    const w = this.base
      + Math.sin(t*0.31)*0.9*this.gust*0.4
      + Math.sin(t*0.83+1.7)*0.5*this.gust*0.4
      + Math.sin(t*2.1+0.4)*0.25*this.gust*0.4;
    if (this.rec){ this.sum += w; this.n++; }
    return w; // [m/s], + = przedni (pod narty), - = tylny
  },
  avg(){ return this.n ? this.sum/this.n : 0; }
};

// ------------------------------------------------------- aerodynamika skoczka
const RHO = 1.18, MASS = 60, G = 9.81, AREA = 1.18;
function cl(aoaDeg){ // krzywa nośnej: maks ~35°, przeciągnięcie za 45°
  const a = aoaDeg;
  if (a < -20) return -0.15;
  if (a < 15)  return 0.10 + (a+0)*(0.45/15)*(a>0?1:0.4);
  if (a < 38)  return 0.55 + (a-15)*(0.32/23);
  if (a < 55)  return 0.87 - (a-38)*(0.30/17);
  return 0.5;
}
function cd(aoaDeg){
  const a = Math.abs(aoaDeg);
  return 0.30 + a*a*0.00028 + (a>40 ? (a-40)*0.012 : 0);
}

// ------------------------------------------------------------------ stan gry
const S = { INRUN:0, TAKEOFF:1, FLIGHT:2, LANDING:3, OUTRUN:4, CRASH:5, RESULT:6 };
const skier = {
  phase: S.INRUN,
  x: -95, y: 0, vx: 0, vy: 0,
  lean: 0,           // sterowanie -1..1 -> kąt ciała
  bodyAngle: 0,      // kąt sylwetki względem toru lotu [deg]
  balance: 0, balV: 0, balQuality: 0, balSamples: 0,
  inrunT: 0, takeoffQuality: 0,
  aoaMean: 0, aoaM2: 0, aoaN: 0, flightT: 0,
  landVSpeed: 0, telemark: false, landT: 0, landWindow: false,
  crashT: 0, distance: 0
};
// tor najazdu: rampa 35° kończąca się stołem
function inrunY(x){ // x od -95 (belka) do 0 (próg)
  if (x > -18) return Math.tan(TAKEOFF_ANGLE)*x;       // stół
  const t = (-x-18)/77;                                 // 0..1 w górę rampy
  return Math.tan(TAKEOFF_ANGLE)*-18 + 38*t*t + 11*t;   // łuk przejściowy
}
function inrunSlope(x){ const e=0.01; return (inrunY(x+e)-inrunY(x-e))/(2*e); }

function resetJump(){
  Object.assign(skier,{ phase:S.INRUN, x:-95, y:inrunY(-95), vx:0, vy:0,
    lean:0, bodyAngle:0, balance:0, balV:0, balQuality:0, balSamples:0,
    inrunT:0, takeoffQuality:0, aoaMean:0, aoaM2:0, aoaN:0, flightT:0,
    landVSpeed:0, telemark:false, landT:0, landWindow:false, crashT:0, distance:0 });
  Wind.reset(); Wind.sum=0; Wind.n=0; Wind.rec=false;
  panel.style.display='none';
  msg.textContent = "NAJAZD: trzymaj balans na środku (←/→ lub palec)\nSPACJA na progu = wybicie!";
}

// ------------------------------------------------------------------- wejście
const keys = {};
let tapQueued = false, touchLean = 0, touchBal = 0, touchStartY = 0, touchStartX = 0;
addEventListener('keydown', e=>{
  if (e.repeat) return;
  keys[e.code]=true;
  if (e.code==='Space'){ tapQueued=true; e.preventDefault(); }
});
addEventListener('keyup', e=>keys[e.code]=false);
addEventListener('touchstart', e=>{
  const t=e.touches[0]; touchStartY=t.clientY; touchStartX=t.clientX;
  tapQueued=true; e.preventDefault();
},{passive:false});
addEventListener('touchmove', e=>{
  const t=e.touches[0];
  touchLean = Math.max(-1,Math.min(1,(touchStartY-t.clientY)/120));
  touchBal  = Math.max(-1,Math.min(1,(t.clientX-touchStartX)/100));
  tapQueued=false; e.preventDefault();
},{passive:false});
addEventListener('touchend', ()=>{ touchLean=0; touchBal=0; });
function leanInput(){
  let v=0; if(keys.ArrowUp)v+=1; if(keys.ArrowDown)v-=1;
  return v || touchLean;
}
function balanceInput(){
  let v=0; if(keys.ArrowLeft)v-=1; if(keys.ArrowRight)v+=1;
  return v || touchBal;
}
function consumeTap(){ const t=tapQueued; tapQueued=false; return t; }

// ----------------------------------------------------------------- symulacja
const DT = 1/240; // substepping fizyki dla stabilnej trajektorii
function step(dt){
  Wind.t += dt;
  switch(skier.phase){
    case S.INRUN:   stepInrun(dt);  break;
    case S.FLIGHT:  stepFlight(dt); break;
    case S.LANDING: stepLanding(dt);break;
    case S.OUTRUN:  stepOutrun(dt); break;
    case S.CRASH:   stepCrash(dt);  break;
  }
}

function stepInrun(dt){
  // mini-gra balansu: losowy dryf + korekta gracza; jakość = czas przy środku
  skier.balV += ((Math.random()-0.5)*3.2 + balanceInput()*-2.6) * dt * 4;
  skier.balV *= 0.985;
  skier.balance = Math.max(-1, Math.min(1, skier.balance + skier.balV*dt));
  skier.balQuality += (Math.abs(skier.balance) < 0.3 ? 1 : 0); skier.balSamples++;

  // zjazd po rampie: przyspieszenie grawitacyjne wzdłuż stoku, tarcie, opór
  const slope = inrunSlope(skier.x);
  const dir = 1/Math.hypot(1,slope);
  const speed = Math.hypot(skier.vx, skier.vy);
  const balPenalty = 1 + Math.abs(skier.balance)*0.35;
  const acc = G*(-slope)*dir - 0.0028*speed*speed*balPenalty - 0.018*G;
  const newSpeed = Math.max(0, speed + acc*dt);
  skier.vx = newSpeed*dir; skier.vy = newSpeed*slope*dir;
  skier.x += skier.vx*dt; skier.y = inrunY(skier.x);

  if (consumeTap() && skier.x > -30) doTakeoff();
  else if (skier.x >= 0) doTakeoff(true); // przegapiony próg = słabe wybicie
}

function doTakeoff(missed){
  // jakość timingu: odchyłka czasowa od krawędzi progu
  const speed = Math.hypot(skier.vx, skier.vy);
  const offset = Math.abs(skier.x)/Math.max(1,speed); // [s] do progu
  let q = missed ? 0.15 : Math.max(0, 1 - Math.max(0, offset-0.09)/0.24);
  skier.takeoffQuality = q;
  skier.x = 0; skier.y = 0;
  const jumpV = 2.3*(0.45+0.55*q); // impuls pionowy [m/s]
  const ang = TAKEOFF_ANGLE;
  skier.vx = speed*Math.cos(ang); skier.vy = speed*Math.sin(ang) + jumpV;
  skier.phase = S.FLIGHT;
  Wind.rec = true;
  msg.textContent = q>0.85 ? "PERFEKCYJNE WYBICIE!" :
                    q>0.5  ? "Dobre wybicie" : "Słabe wybicie…";
  setTimeout(()=>{ if(skier.phase===S.FLIGHT)
    msg.textContent="LOT: ↑/↓ — walcz o kąt natarcia"; }, 900);
}

function stepFlight(dt){
  // sterowanie sylwetką (rate-limit — bezwładność ciała)
  const target = leanInput()*22;
  skier.bodyAngle += Math.max(-45*dt, Math.min(45*dt, target - skier.bodyAngle));

  const w = Wind.sample();               // + przedni => powietrze naprzeciw
  const airVx = skier.vx + w;            // wiatr przedni zwiększa v względne
  const airVy = skier.vy;
  const v2 = airVx*airVx + airVy*airVy, v = Math.sqrt(v2);
  const flightAngle = Math.atan2(airVy, airVx)*180/Math.PI;
  const aoa = 6 + skier.bodyAngle - flightAngle*0.7;    // efektywny kąt natarcia

  // Welford — stabilność lotu dla sędziów
  skier.aoaN++; const d0=aoa-skier.aoaMean;
  skier.aoaMean+=d0/skier.aoaN; skier.aoaM2+=d0*(aoa-skier.aoaMean);
  skier.flightT += dt;

  const q = 0.5*RHO*v2*AREA;
  const L = q*cl(aoa)/MASS, D = q*cd(aoa)/MASS;
  const nx = -airVy/v, ny = airVx/v;     // kierunek nośnej ⊥ do opływu
  skier.vx += (-D*airVx/v + L*nx)*dt;
  skier.vy += (-D*airVy/v + L*ny - G)*dt;
  skier.x += skier.vx*dt; skier.y += skier.vy*dt;

  // kontakt z zeskokiem
  if (skier.y <= hillY(skier.x)){
    Wind.rec = false;
    skier.distance = distanceAt(skier.x);
    skier.landVSpeed = -(skier.vy - skier.vx*hillSlope(skier.x)); // v ⊥ do stoku
    const tooHard = skier.landVSpeed > 7.5 || Math.abs(aoa) > 60;
    if (tooHard){ skier.phase = S.CRASH; skier.crashT=0;
      msg.textContent = "UPADEK!"; return; }
    skier.phase = S.LANDING; skier.landT = 0; skier.landWindow = true;
    msg.textContent = "SPACJA = TELEMARK!";
  }
}

function stepLanding(dt){
  skier.landT += dt;
  followSlope(dt, 0.006);
  if (skier.landWindow && consumeTap()){
    skier.landWindow = false;
    if (skier.landVSpeed > 6.4 && Math.random() < 0.5){ // ryzykowny telemark
      skier.phase = S.CRASH; skier.crashT = 0; msg.textContent = "PODPARCIE!"; return;
    }
    skier.telemark = true;
  }
  if (skier.landT > 0.35){ skier.phase = S.OUTRUN;
    msg.textContent = skier.telemark ? "TELEMARK! Piękny styl." : "Lądowanie na dwie nogi"; }
}

function stepOutrun(dt){
  followSlope(dt, 0.05);
  if (Math.hypot(skier.vx,skier.vy) < 2) showResult(false);
}

function stepCrash(dt){
  skier.crashT += dt;
  followSlope(dt, 0.12); // ragdoll sunie z silnym tarciem — dyssypacja energii
  if (skier.crashT > 2.2) showResult(true);
}

function followSlope(dt, friction){
  const slope = hillSlope(skier.x);
  const dir = 1/Math.hypot(1,slope);
  let speed = Math.hypot(skier.vx, skier.vy);
  speed = Math.max(0, speed + (G*(-slope)*dir - friction*G*10 - 0.002*speed*speed)*dt);
  skier.vx = speed*dir; skier.vy = speed*slope*dir;
  skier.x += skier.vx*dt; skier.y = hillY(skier.x);
}

// -------------------------------------------------------------- punktacja FIS
function fisScore(crash){
  const dist = skier.distance;
  const distPts = 60 + (dist - K_POINT)*METER_VALUE;
  const wAvg = Wind.avg();
  const windComp = wAvg >= 0 ? -wAvg*WIND_FACTOR : -wAvg*WIND_FACTOR*1.5;
  const aoaStd = skier.aoaN>1 ? Math.sqrt(skier.aoaM2/(skier.aoaN-1)) : 0;

  let base = 20 - Math.min(5, aoaStd*0.45) - (1-skier.takeoffQuality)*1.5;
  if (!skier.telemark) base -= 2;
  base -= Math.min(2, Math.max(0, skier.landVSpeed-3.5)*0.6);
  if (dist > HILL_SIZE) base -= 1.5;
  if (crash) base = Math.min(base, 11);
  base = Math.max(6, base);

  const marks = [];
  for (let i=0;i<5;i++)
    marks.push(Math.max(0,Math.min(20, Math.round((base+(Math.random()-0.5))*2)/2)));
  const sorted=[...marks].sort((a,b)=>a-b);
  const stylePts = sorted[1]+sorted[2]+sorted[3];
  const total = Math.max(0, distPts + windComp + stylePts);
  return { dist, distPts, windComp, wAvg, marks, sorted, stylePts, total, crash };
}

function showResult(crash){
  skier.phase = S.RESULT;
  const r = fisScore(crash);
  const min=r.sorted[0], max=r.sorted[4];
  let used={};
  const judges = r.marks.map(m=>{
    const strike=(m===min&&!used.min&&(used.min=true))||(m===max&&!used.max&&(used.max=true));
    return `<span class="${strike?'strike':''}">${m.toFixed(1)}</span>`;
  }).join(' · ');
  panel.innerHTML = `
    <h2>${crash?'💥 Upadek':'🎿 '+r.dist.toFixed(1)+' m'}</h2>
    <table>
      <tr><td>Odległość (K-${K_POINT})</td><td>${r.distPts.toFixed(1)} pkt</td></tr>
      <tr><td>Wiatr śr. ${r.wAvg>=0?'przedni':'tylny'} ${Math.abs(r.wAvg).toFixed(2)} m/s</td>
          <td>${r.windComp>=0?'+':''}${r.windComp.toFixed(1)} pkt</td></tr>
      <tr><td>Noty sędziów</td><td class="judges">${judges}</td></tr>
      <tr><td>Styl (3 środkowe)</td><td>${r.stylePts.toFixed(1)} pkt</td></tr>
    </table>
    <div class="total">RAZEM: ${r.total.toFixed(1)} pkt</div>
    ${r.dist>=HILL_SIZE&&!crash?'<div style="color:#8fd0ff">🏔️ Skok za rozmiar skoczni (HS)!</div>':''}
    <button onclick="resetJump()">Skocz jeszcze raz (R)</button>`;
  panel.style.display='block';
  msg.textContent='';
}

// -------------------------------------------------------------------- render
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud'), windEl = document.getElementById('wind');
const msg = document.getElementById('msg'), panel = document.getElementById('panel');
function resize(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize', resize); resize();

const snowflakes = Array.from({length:120},()=>({x:Math.random(),y:Math.random(),
  s:0.5+Math.random()*1.5}));

function worldToScreen(wx, wy, cam, zoom){
  return [ (wx-cam.x)*zoom + innerWidth*0.42, -(wy-cam.y)*zoom + innerHeight*0.42 ];
}

function draw(){
  const inFlight = skier.phase===S.FLIGHT;
  const zoom = inFlight ? Math.max(3.4, 9 - skier.flightT*1.2) : 6.5;
  const cam = { x: skier.x + (inFlight?18:8), y: skier.y - (inFlight?6:2) };

  // niebo
  const g = ctx.createLinearGradient(0,0,0,innerHeight);
  g.addColorStop(0,'#12253d'); g.addColorStop(1,'#3d6389');
  ctx.fillStyle=g; ctx.fillRect(0,0,innerWidth,innerHeight);

  // padający śnieg (przesuwany wiatrem)
  const w = Wind.base;
  ctx.fillStyle='rgba(255,255,255,.65)';
  for(const f of snowflakes){
    f.y+=0.0012*f.s; f.x+=0.0004*w*f.s;
    if(f.y>1)f.y=0; if(f.x>1)f.x=0; if(f.x<0)f.x=1;
    ctx.fillRect(f.x*innerWidth, f.y*innerHeight, f.s+0.5, f.s+0.5);
  }

  // profil skoczni: najazd + zeskok
  ctx.beginPath();
  let first=true;
  for(let x=-100;x<=220;x+=1){
    const y = x<0 ? inrunY(x) : hillY(x);
    const [sx,sy]=worldToScreen(x,y,cam,zoom);
    first?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy); first=false;
  }
  const [ex,ey]=worldToScreen(220,hillY(220)-60,cam,zoom);
  ctx.lineTo(ex,ey);
  const [bx,by]=worldToScreen(-100,inrunY(-100)-80,cam,zoom);
  ctx.lineTo(bx,by); ctx.closePath();
  ctx.fillStyle='#e8f2fb'; ctx.fill();
  ctx.strokeStyle='#b9d2e8'; ctx.lineWidth=2; ctx.stroke();

  // linie K i HS na zeskoku
  for(const [distMark,color,label] of [[K_POINT,'#d43a3a','K'],[HILL_SIZE,'#2f7fd4','HS']]){
    let x=0; while(x<220 && distanceAt(x)<distMark) x+=0.5;
    const [sx,sy]=worldToScreen(x,hillY(x),cam,zoom);
    ctx.strokeStyle=color; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(sx-14,sy); ctx.lineTo(sx+14,sy); ctx.stroke();
    ctx.fillStyle=color; ctx.font='bold 13px sans-serif';
    ctx.fillText(label+distMark, sx+18, sy+4);
  }

  // zawodnik
  const [px,py]=worldToScreen(skier.x,skier.y,cam,zoom);
  ctx.save(); ctx.translate(px,py);
  const va = skier.phase===S.FLIGHT
    ? Math.atan2(-skier.vy,skier.vx) - skier.bodyAngle*Math.PI/180*0.5
    : Math.atan2(skier.phase===S.INRUN?-inrunSlope(skier.x):-hillSlope(skier.x),1);
  ctx.rotate(va);
  if (skier.phase===S.CRASH){ ctx.rotate(skier.crashT*6); }
  // narty
  ctx.strokeStyle='#ffd11a'; ctx.lineWidth=3;
  if (skier.phase===S.FLIGHT){ // styl V
    ctx.beginPath(); ctx.moveTo(-14,3); ctx.lineTo(16,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-14,6); ctx.lineTo(16,8); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-14,5); ctx.lineTo(14,5); ctx.stroke();
  }
  // sylwetka
  ctx.strokeStyle='#e3ecf5'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath();
  if (skier.phase===S.FLIGHT){ ctx.moveTo(-8,4); ctx.lineTo(10,-4); } // płasko nad nartami
  else if (skier.telemark && skier.phase!==S.INRUN){ ctx.moveTo(-4,5); ctx.lineTo(0,-6); ctx.lineTo(6,-10); }
  else { ctx.moveTo(-2,5); ctx.lineTo(0,-4); ctx.lineTo(4,-9); }
  ctx.stroke();
  ctx.fillStyle='#d43a3a'; // kask
  ctx.beginPath();
  ctx.arc(skier.phase===S.FLIGHT?12:5, skier.phase===S.FLIGHT?-6:-10, 3.4, 0, 7);
  ctx.fill();
  ctx.restore();

  // HUD
  const speed=(Math.hypot(skier.vx,skier.vy)*3.6).toFixed(0);
  let line2='';
  if (skier.phase===S.INRUN){
    const q = skier.balSamples?Math.round(100*skier.balQuality/skier.balSamples):100;
    line2 = `Balans: ${'█'.repeat(Math.round((1-Math.abs(skier.balance))*10)).padEnd(10,'░')} ${q}%`;
  }
  if (skier.phase===S.FLIGHT)
    line2 = `Lot: ${skier.flightT.toFixed(1)} s  |  odległość ~${distanceAt(Math.max(0,skier.x)).toFixed(0)} m`;
  hud.textContent = `⛷ ${speed} km/h\n${line2}`;
  hud.style.whiteSpace='pre';

  const wNow = Wind.base + Math.sin((Wind.t+Wind.seed)*0.31)*0.36*Wind.gust;
  windEl.innerHTML = `${wNow>=0?'⬅':'➡'} wiatr ${Math.abs(wNow).toFixed(1)} m/s<br>` +
    `<small style="color:${wNow>=0?'#7fdc8f':'#ff9a7a'}">${wNow>=0?'przedni (nośny)':'tylny (duszący)'}</small>`;
}

// restart klawiszem R
addEventListener('keydown', e=>{ if(e.code==='KeyR' && skier.phase===S.RESULT) resetJump(); });

// ------------------------------------------------------------------ main loop
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(0.1,(now-last)/1000); last = now;
  while (acc >= DT){ step(DT); acc -= DT; }
  draw();
  requestAnimationFrame(frame);
}
resetJump();
requestAnimationFrame(frame);
window.__skier = skier; // hak diagnostyczny (testy automatyczne / debug)
</script>
</body>
</html>
